[project]
name = "aston"
version = "0.1.0"
description = "Self-maintaining API migration tool"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "libcst>=1.0.0",
    "packaging>=21.0",
    "jedi>=0.18.0",
    "argparse>=1.4.0"
]

[project.scripts]
aston = "aston.cli.main:main"

[tool.setuptools]
packages = ["aston"]