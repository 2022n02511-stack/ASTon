[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astoncli"  # Available on PyPI, while your internal app and CLI command remain 'aston'
version = "0.2.1"
description = "Automated Python repository migration CLI tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "libcst>=1.0.0",
    "packaging>=21.0",
    "jedi>=0.18.0",
    "argparse>=1.4.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "mistralai>=1.0.0",
    "anthropic>=0.20.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
aston = "aston.cli.main:main"

[tool.setuptools]
packages = ["aston"]